[project]
name = "seasonsense-ai"
version = "1.0.0"
description = "SeasonSense AI Smart Crop Advisory Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "pydantic",
    "python-multipart"
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"